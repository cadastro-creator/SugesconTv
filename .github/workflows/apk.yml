# Compila, assina e publica o APK a cada tag v* (ex.: v1.0.0)
# ou pelo botão Actions → "APK para TV" → Run workflow, informando a versão.
name: APK para TV

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão do app (ex.: 1.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Versão a partir da tag (ou do botão Run workflow)
        env:
          VERSAO_INFORMADA: ${{ github.event.inputs.versao }}
        run: |
          if [ -n "$VERSAO_INFORMADA" ]; then VERSAO="${VERSAO_INFORMADA#v}"; else VERSAO="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$VERSAO" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Use versões no formato 1.2.3 (recebido: $VERSAO)"; exit 1
          fi
          echo "TAG=v$VERSAO" >> "$GITHUB_ENV"
          CODIGO=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "CODIGO=$CODIGO" >> "$GITHUB_ENV"

      - name: Chave de assinatura (sempre a mesma)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Configure os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD (veja o README)."; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/assinatura.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Opcional: variável do repositório SITE_URL (ex.: https://painel.minhaempresa.com.br).
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          gradle --no-daemon assembleRelease -PversionCode="$CODIGO" -PversionName="$VERSAO" -PsiteUrl="$SITE_URL"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/sugescontv.apk"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/sugescontv.apk" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/sugescontv.apk" --target "$GITHUB_SHA" \
              --title "SugesconTv $VERSAO" \
              --notes "APK para Android TV / Google TV / Fire TV (Fire OS). As TVs com o app instalado se atualizam sozinhas."
          fi

      - name: Copiar para /app no site
        env:
          RAMO: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$RAMO"
          git checkout -B publicar-app "origin/$RAMO"
          cp "$RUNNER_TEMP/sugescontv.apk" public/app/sugescontv.apk
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apk": "sugescontv.apk"\n}\n' "$CODIGO" "$VERSAO" > public/app/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app/sugescontv.apk public/app/version.json
          git commit -m "App da TV: versão $VERSAO"
          git push origin "HEAD:$RAMO"
