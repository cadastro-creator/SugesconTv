# Modo imagem: fotografa as páginas marcadas no painel e envia ao site.
# De segunda a sexta, das 7h às 19h (horário de Brasília = UTC-3), a cada 15 min.
# O GitHub atrasa ou pula muitos agendamentos, então cada execução fica ligada em
# ciclo (fotos a cada 15 min, por até ~5h40) e os agendamentos só servem para
# religar o ciclo quando ele termina. Execuções novas esperam a atual acabar.
# Também dá para rodar na hora: Actions → "Fotos do modo imagem" → Run workflow.
name: Fotos do modo imagem

on:
  schedule:
    - cron: '7,22,37,52 10-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fotos
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar o robô (usa o Chrome que já vem na máquina)
        run: |
          mkdir -p "$RUNNER_TEMP/robo" && cd "$RUNNER_TEMP/robo"
          npm install --no-save --no-package-lock --silent playwright-core@1.56.1
          cp "$GITHUB_WORKSPACE/scripts/tirar-fotos.mjs" .
      - name: Tirar e enviar as fotos
        working-directory: ${{ runner.temp }}/robo
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FOTOS_TOKEN: ${{ secrets.FOTOS_TOKEN }}
        run: |
          fim=$(( $(date +%s) + 340 * 60 ))
          while :; do
            if node tirar-fotos.mjs; then falhou=0; else falhou=1; fi
            agora=$(date +%s)
            # Próxima rodada no próximo múltiplo de 15 min; para às 22h UTC (19h em Brasília).
            proxima=$(( (agora / 900 + 1) * 900 ))
            if [ "$(date -u -d @$proxima +%H)" -ge 22 ] || [ "$(date -u -d @$proxima +%H)" -lt 10 ] || [ $proxima -ge $fim ]; then break; fi
            echo "Próxima rodada às $(TZ=America/Sao_Paulo date -d @$proxima +%H:%M) (Brasília)."
            sleep $(( proxima - agora ))
          done
          exit $falhou
